<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Frip'Hoche — Espace admin</title>
<meta name="theme-color" content="#1A1A2E">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div style="max-width:520px;margin:0 auto">

  <header class="entete-sombre">
    <div class="rangee">
      <div>
        <h1 id="titre">Espace admin</h1>
        <div class="sous" id="sous-titre">Chargement…</div>
      </div>
      <span class="pill" id="badge"
            style="background:#4A2480;color:#C4A8EE;font-size:10px">&nbsp;</span>
    </div>
  </header>

  <main class="page" style="margin-top:-12px">

    <!-- Compteurs -->
    <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:7px;margin-bottom:13px">
      <div class="cartouche cartouche-vert">
        <div class="titre-c">En stock</div>
        <div class="nombre" id="n-dispo">–</div>
      </div>
      <div class="cartouche cartouche-violet">
        <div class="titre-c">Réservés</div>
        <div class="nombre" id="n-reserve">–</div>
      </div>
      <div class="cartouche" style="background:#EBEBEB">
        <div class="titre-c" style="color:#4A4A5A">Vendus</div>
        <div class="nombre" style="color:#2E2E3E" id="n-vendu">–</div>
      </div>
    </div>

    <!-- Dépôts d'argent signalés -->
    <div id="bloc-depots" hidden style="margin-bottom:14px">
      <div class="titre-section">&#128234; Argent signalé dans la boîte</div>
      <div id="liste-depots"></div>
    </div>

    <!-- Ajouter -->
    <a href="admin-article.html" id="lien-ajout"
       style="display:flex;align-items:center;gap:11px;background:#4A2480;
              border-radius:12px;padding:14px;margin-bottom:16px;text-decoration:none">
      <span style="width:36px;height:36px;border-radius:9px;background:#9B72CF;
                   display:flex;align-items:center;justify-content:center;
                   font-size:20px;color:#fff;flex-shrink:0">+</span>
      <span style="flex:1">
        <span style="display:block;font-size:15px;font-weight:900;color:#fff">Ajouter un article</span>
        <span style="display:block;font-size:11px;color:#C4A8EE">Photos, taille, marque, jetons</span>
      </span>
      <span style="color:#C4A8EE;font-size:17px">&#8250;</span>
    </a>

    <!-- Brouillons -->
    <div id="bloc-brouillons" hidden>
      <div class="titre-section">&#9998; Brouillons à compléter</div>
      <div id="liste-brouillons"></div>
      <div style="height:12px"></div>
    </div>

    <!-- Gestion -->
    <div class="titre-section">&#9881; Gestion</div>
    <div id="menu"></div>

    <div style="height:22px"></div>
  </main>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/app.js"></script>
<script>
(function () {

  let profilConnecte = null;

  (async function demarrer() {
    const p = await exigerEquipe();
    if (!p) return;
    profilConnecte = p;
    afficherNavigation('admin');
    libererReservationsExpirees();

    const admin = p.role === 'admin';
    document.getElementById('sous-titre').textContent =
      p.prenom + (admin ? ' · administratrice' : ' · bénévole');
    document.getElementById('badge').textContent = admin ? 'ADMIN' : 'BÉNÉVOLE';

    const droits = await mesDroits();
    construireMenu(droits);
    compter();
    chargerBrouillons();
    chargerDepots(droits);

    if (!droits.ajouter_article) document.getElementById('lien-ajout').hidden = true;
  })();

  async function compter() {
    const paires = [['disponible','n-dispo'], ['reserve','n-reserve'], ['vendu','n-vendu']];
    for (const [statut, cible] of paires) {
      const { count } = await db.from('articles')
        .select('id', { count: 'exact', head: true }).eq('statut', statut);
      document.getElementById(cible).textContent = count ?? 0;
    }
  }

  async function chargerBrouillons() {
    const { data } = await db.from('articles')
      .select('id, numero, nom, cree_le')
      .eq('statut', 'brouillon')
      .order('cree_le', { ascending: false }).limit(8);

    if (!data || !data.length) return;

    document.getElementById('liste-brouillons').innerHTML = data.map(a => `
      <a class="ligne" href="admin-article.html?id=${a.id}" style="text-decoration:none">
        <span style="font-size:17px">&#128087;</span>
        <span class="contenu">
          <span class="titre-ligne">#${String(a.numero).padStart(3,'0')} · ${echapper(a.nom)}</span>
          <span class="micro" style="display:block">${depuis(a.cree_le)}</span>
        </span>
        <span class="pill pill-brouillon">Brouillon</span>
        <span class="fleche">&#8250;</span>
      </a>`).join('');
    document.getElementById('bloc-brouillons').hidden = false;
  }

  async function chargerDepots(droits) {
    const { data } = await db.rpc('depots_en_attente');
    const liste = data || [];
    if (!liste.length) return;

    const peut = !!droits.crediter_jetons;

    document.getElementById('liste-depots').innerHTML = liste.map(d => {
      const jetons = Math.floor(Number(d.montant) / PRIX_JETON);
      const soi = d.etudiant_id === profilConnecte.id;
      return `
        <div class="ligne statique" style="border-color:#E8C547;background:#FFFBF0;
             align-items:flex-start;flex-direction:column;gap:9px">
          <div style="display:flex;gap:10px;width:100%;align-items:flex-start">
            <span class="avatar avatar-s">${initiales(d.prenom, d.nom)}</span>
            <span class="contenu">
              <span class="titre-ligne">${echapper(d.prenom)} ${echapper(d.nom)}
                — ${Number(d.montant).toFixed(2).replace('.', ',')} €</span>
              <span class="micro">${echapper(d.classe || '')} · signalé ${depuis(d.signale_le)}
                · ${jetons} ${motJetons(jetons)}</span>
              ${d.message ? `<span class="micro" style="display:block;font-style:italic">
                « ${echapper(d.message)} »</span>` : ''}
            </span>
          </div>
          ${peut && !soi ? `
            <div style="display:flex;gap:7px;width:100%">
              <button type="button" class="btn btn-petit confirmer-depot"
                      data-id="${d.id}" data-jetons="${jetons}"
                      data-prenom="${echapper(d.prenom)}"
                      style="flex:1">Argent reçu · créditer ${jetons}</button>
              <button type="button" class="btn btn-petit btn-secondaire introuvable-depot"
                      data-id="${d.id}" data-prenom="${echapper(d.prenom)}"
                      style="border-color:#E8C547;color:#8A6000">Rien trouvé</button>
            </div>` : `
            <span class="micro" style="color:#8A6000">
              ${soi ? 'Ton propre signalement : une autre personne doit le traiter.'
                    : "Tu n'as pas le droit de créditer des jetons."}</span>`}
        </div>`;
    }).join('');

    document.getElementById('bloc-depots').hidden = false;
    brancherDepots();
  }

  function brancherDepots() {
    document.querySelectorAll('.confirmer-depot').forEach(b => {
      b.onclick = async () => {
        const n = Number(b.dataset.jetons);
        if (!confirm(`Confirmer la réception et créditer ${n} jeton(s) à ${b.dataset.prenom} ?`)) return;
        b.disabled = true; b.textContent = '…';
        try {
          const { data, error } = await db.rpc('traiter_depot',
            { p_depot: Number(b.dataset.id), p_jetons: n, p_note: null });
          if (error) throw error;
          if (!data.ok) { notifier(data.message, 'erreur'); b.disabled = false;
                          b.textContent = `Argent reçu · créditer ${n}`; return; }
          notifier(`${data.jetons} ${motJetons(data.jetons)} crédités à ${data.prenom}`, 'ok');
          setTimeout(() => location.reload(), 1000);
        } catch (err) {
          notifier(messageErreur(err), 'erreur');
          b.disabled = false; b.textContent = `Argent reçu · créditer ${n}`;
        }
      };
    });

    document.querySelectorAll('.introuvable-depot').forEach(b => {
      b.onclick = async () => {
        if (!confirm(`Aucun argent trouvé pour ${b.dataset.prenom} ?\n\n`
                   + 'Le signalement sera clos sans crédit.')) return;
        const note = prompt('Précision (facultatif) :') || null;
        b.disabled = true;
        try {
          const { data, error } = await db.rpc('traiter_depot',
            { p_depot: Number(b.dataset.id), p_jetons: 0, p_note: note });
          if (error) throw error;
          if (!data.ok) { notifier(data.message, 'erreur'); b.disabled = false; return; }
          notifier('Signalement clos', 'ok');
          setTimeout(() => location.reload(), 900);
        } catch (err) {
          notifier(messageErreur(err), 'erreur');
          b.disabled = false;
        }
      };
    });
  }

  function construireMenu(d) {
    const entrees = [
      { lien:'admin-articles.html',  icone:'&#128087;', nom:'Tous les articles', ok:true },
      { lien:'admin-jetons.html',    icone:'&#129689;', nom:'Achat de jetons', ok:!!d.crediter_jetons },
      { lien:'admin-etudiants.html', icone:'&#127979;', nom:'Comptes étudiants', ok:!!d.voir_etudiants },
      { lien:'admin-benevoles.html', icone:'&#128101;', nom:'Comptes bénévoles', ok:!!d.admin },
      { lien:'admin-horaires.html',  icone:'&#128340;', nom:'Horaires et local', ok:!!d.admin },
      { lien:'admin-reglages.html',  icone:'&#127991;', nom:'Marques, catégories et classes', ok:!!d.admin },
    ].filter(e => e.ok);

    document.getElementById('menu').innerHTML = entrees.map(e => `
      <a class="ligne" href="${e.lien}" style="text-decoration:none">
        <span style="font-size:17px">${e.icone}</span>
        <span class="contenu"><span class="titre-ligne">${e.nom}</span></span>
        <span class="fleche">&#8250;</span>
      </a>`).join('');
  }
})();
</script>
</body>
</html>
